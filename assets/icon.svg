<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- broadcast waves left -->
  <g clip-path="url(#tile)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="12">
    <path d="M 84 92 A 52 52 0 0 0 84 164" stroke-opacity="0.95"/>
    <path d="M 60 70 A 82 82 0 0 0 60 186" stroke-opacity="0.65"/>
    <path d="M 36 50 A 110 110 0 0 0 36 206" stroke-opacity="0.35"/>
    <!-- right -->
    <path d="M 172 92 A 52 52 0 0 1 172 164" stroke-opacity="0.95"/>
    <path d="M 196 70 A 82 82 0 0 1 196 186" stroke-opacity="0.65"/>
    <path d="M 220 50 A 110 110 0 0 1 220 206" stroke-opacity="0.35"/>
  </g>
  <!-- bolt -->
  <path d="M 138 58 L 98 136 L 126 136 L 114 198 L 160 114 L 131 114 L 146 58 Z"
        fill="url(#bolt)" stroke="#0f172a" stroke-opacity="0.25" stroke-width="3" stroke-linejoin="round"/>
</svg>
